[package]
name = "cfd-validation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cfd-validation"
readme = "README.md"
description = "Validation framework and benchmark problems for CFD simulations"
keywords = ["cfd", "validation", "benchmark", "convergence", "mms"]
categories = ["science", "development-tools::testing"]
exclude = ["outputs/**"]

[dependencies]
cfd-core.workspace = true
cfd-math.workspace = true
cfd-io.workspace = true
cfd-1d.workspace = true
cfd-2d.workspace = true
cfd-3d.workspace = true
cfd-mesh.workspace = true
cfd-schematic-mesh.workspace = true
cfd-schematics.workspace = true
leto.workspace = true
leto-ops.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
chrono = "0.4"
num_cpus = "1.16"
eunomia.workspace = true
moirai.workspace = true
petgraph.workspace = true
aequitas.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

athena-leto.workspace = true

[[bench]]
name = "convergence_benchmarks"
harness = false

[[bench]]
name = "gcl_benchmark"
harness = false

[[bench]]
name = "memory_profiling"
harness = false

[lints]
workspace = true
