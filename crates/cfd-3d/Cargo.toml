[package]
name = "cfd-3d"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cfd-3d"
readme = "README.md"
description = "3D CFD solvers: FEM, spectral, immersed boundary, and multiphase methods"
keywords = ["cfd", "fem", "spectral", "multiphase", "cavitation"]
categories = ["science", "simulation"]

[dependencies]
cfd-1d.workspace = true
cfd-2d.workspace = true
cfd-core.workspace = true
cfd-math.workspace = true
cfd-mesh.workspace = true
cfd-schematic-mesh.workspace = true
cfd-io.workspace = true
apollo-fft.workspace = true
apollo-nufft.workspace = true
aequitas.workspace = true
leto.workspace = true
leto-ops.workspace = true
eunomia.workspace = true
cfd-schematics.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
moirai.workspace = true
tracing.workspace = true
# csgrs = { version = "0.19", features = ["f64", "stl-io", "delaunay"], optional = true }

[features]
default = []


[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
cfd-validation.workspace = true
cfd-schematics.workspace = true

[[bench]]
name = "smagorinsky_benchmark"
harness = false

[lints]
workspace = true
