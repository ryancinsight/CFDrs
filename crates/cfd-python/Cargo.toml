[package]
name = "cfd-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cfd-python"
readme = "README.md"
description = "Python bindings for CFD-rs solvers using PyO3"
keywords = ["cfd", "python", "pyo3", "bindings", "simulation"]
categories = ["science", "simulation", "api-bindings"]

[lib]
name = "cfd_python"
crate-type = ["cdylib"]
test = false

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
numpy = "0.29"
leto.workspace = true
eunomia.workspace = true
aequitas.workspace = true

# Internal dependencies
cfd-1d = { path = "../cfd-1d" }
cfd-2d = { path = "../cfd-2d" }
cfd-3d = { path = "../cfd-3d" }
cfd-core = { path = "../cfd-core" }
cfd-mesh = { workspace = true }
cfd-validation = { path = "../cfd-validation" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
