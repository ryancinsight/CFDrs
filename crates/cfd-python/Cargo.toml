[package]
name = "cfd-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for CFD-rs solvers using PyO3"
readme = "README.md"

[lib]
name = "cfd_python"
crate-type = ["cdylib"]
test = false

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
numpy = "0.29"
leto.workspace = true
eunomia.workspace = true
aequitas.workspace = true

# Internal dependencies
cfd-1d = { path = "../cfd-1d" }
cfd-2d = { path = "../cfd-2d" }
cfd-3d = { path = "../cfd-3d" }
cfd-core = { path = "../cfd-core" }
cfd-mesh = { workspace = true }
cfd-validation = { path = "../cfd-validation" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
