[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cfd-python"
# Single source of truth: maturin reads the version from Cargo.toml, which
# inherits the workspace version.
dynamic = ["version"]
description = "Python bindings for CFD-rs CFD solvers"
readme = "README.md"
# Matches the abi3-py38 floor declared in Cargo.toml.
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [
    {name = "Ryan Clanton", email = "ryan@clanton.dev"}
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://ryancinsight.github.io/CFDrs/"
Repository = "https://github.com/ryancinsight/CFDrs"
Documentation = "https://ryancinsight.github.io/CFDrs/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "pandas>=1.3",
]
validation = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "scipy>=1.7",
    "jupyter>=1.0",
]
