[package]
name = "cfd-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cfd-core"
readme = "README.md"
description = "Core abstractions and plugin system for the CFD simulation suite"
keywords = ["cfd", "simulation", "fluid-dynamics", "physics", "plugin"]
categories = ["science", "simulation"]

[dependencies]
aequitas = { workspace = true, features = ["serde"] }
proteus.workspace = true
chrono = { version = "0.4", features = ["serde"] }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bytemuck = { version = "1.14", features = ["derive"] }
futures = "0.3"
num_cpus = "1.16"
leto.workspace = true
eunomia.workspace = true
indexmap.workspace = true
moirai.workspace = true
themis.workspace = true
melinoe = { workspace = true, features = ["std"] }
hephaestus-wgpu = { workspace = true, optional = true }

[features]
default = ["gpu"]
gpu = ["dep:hephaestus-wgpu"]
simd = []
experimental = []

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
tracing-subscriber.workspace = true
leto-ops.workspace = true

[[bench]]
name = "turbulence_benchmark"
harness = false
required-features = ["gpu"]

[lints]
workspace = true
