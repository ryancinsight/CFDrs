[workspace]
members = [
    "crates/cfd-core",
    "crates/cfd-math",
    "crates/cfd-io",
    "crates/cfd-schematics",
    "crates/cfd-schematic-mesh",
    "crates/cfd-1d",
    "crates/cfd-2d",
    "crates/cfd-3d",
    "crates/cfd-optim",
    "crates/cfd-validation",
    "crates/cfd-python",
    "xtask",
]
exclude = []
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Ryan Clanton <ryan@clanton.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/cfd-suite"
homepage = "https://github.com/ryancinsight/cfd-suite"
documentation = "https://docs.rs/cfd-suite"
readme = "README.md"
keywords = ["cfd", "simulation", "fluid-dynamics", "computational", "physics"]
categories = ["science", "simulation"]

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
hashbrown = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Math and numerical
aequitas = {path = "../../repos/aequitas", package = "aequitas", features = ["std"], default-features = false}
proteus = {path = "../../repos/proteus", package = "proteus"}
hyperion = {path = "../../repos/hyperion", package = "hyperion", features = ["std"], default-features = false}
tyche-core = { path = "../../repos/tyche/crates/tyche-core" }
eunomia = {path = "../../repos/eunomia/crates/eunomia", package = "eunomia", features = ["std"], default-features = false}
iris = {path = "../../repos/iris", package = "iris"}
approx = "0.5"
bytemuck = "1.14"
rand = "0.8"

# Data structures
indexmap = "2.0"
petgraph = "0.6"
slotmap = "1.0"

# Mesh / geometry
geometry-predicates = "0.3"

# Documentation
aquamarine = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }

# File I/O
csv = "1.3"

# Testing
proptest = "1.4"
criterion = "0.5"

# Internal crates
cfd-core = { path = "crates/cfd-core", default-features = false }
cfd-math = { path = "crates/cfd-math" }
cfd-io = { path = "crates/cfd-io" }
# Shared Atlas foundation crates consumed as path dependencies from local
# working copies at the atlas root. Publish changes to canonical remotes
# (commit + push), then update path targets here.
cfd-mesh = { path = "../../repos/gaia", package = "gaia" }
apollo-fft = { path = "../../repos/apollo/crates/apollo-fft", package = "apollo-fft" }
apollo-nufft = { path = "../../repos/apollo/crates/apollo-nufft", package = "apollo-nufft" }
leto = {path = "../../repos/leto/crates/leto", package = "leto", features = ["std"], default-features = false}
leto-ops = {path = "../../repos/leto/crates/leto-ops", package = "leto-ops", features = ["std"], default-features = false}
# consus: pure-Rust scientific storage formats (HDF5 etc.). Consumed by cfd-io
# behind the `hdf5` feature for real HDF5 output.
consus-core = {path = "../../repos/consus/crates/consus-core", package = "consus-core", default-features = false}
consus-hdf5 = {path = "../../repos/consus/crates/consus-hdf5", package = "consus-hdf5"}
consus-io = {path = "../../repos/consus/crates/consus-io", package = "consus-io"}
# ritk: RITK imaging toolkit; owns the VTK data model and I/O. Consumed by
# cfd-io behind the `vtk` feature for VTK creation.
ritk-vtk = { path = "../../repos/ritk/crates/ritk-vtk", package = "ritk-vtk" }
# hermes: SIMD abstraction workspace. Provides generic runtime-dispatched
# SIMD operations (dot, elementwise, reductions) over f32/f64/i32.
hermes-simd = { path = "../../repos/hermes/crates/hermes-simd", package = "hermes-simd" }
# moirai: unified concurrency runtime replacing tokio + rayon. Moirai's parallel,
# Mnemosyne, and Melinoe surfaces are enabled for the CFDrs workspace.
moirai = {path = "../../repos/moirai/moirai", package = "moirai-runtime", features = ["parallel", "mnemosyne-memory", "melinoe"], default-features = false}
# hephaestus-wgpu: Atlas GPU provider used for device acquisition and the
# ongoing replacement of CFDrs-owned raw WGPU kernels.
hephaestus-wgpu = { path = "../../repos/hephaestus/crates/hephaestus-wgpu", package = "hephaestus-wgpu" }
# athena: backend-neutral Krylov solver suite (athena-core = contracts,
# athena-leto = Leto CPU backend). Used by cfd-math/linear_solver/krylov.rs.
athena-core = {path = "../../repos/athena/crates/athena-core", package = "athena-core"}
athena-leto = {path = "../../repos/athena/crates/athena-leto", package = "athena-leto"}
cfd-schematics = { path = "crates/cfd-schematics" }
cfd-schematic-mesh = { path = "crates/cfd-schematic-mesh" }
cfd-1d = { path = "crates/cfd-1d" }
cfd-2d = { path = "crates/cfd-2d" }
cfd-3d = { path = "crates/cfd-3d" }
cfd-optim = { path = "crates/cfd-optim" }
cfd-validation = { path = "crates/cfd-validation" }

# Redirect all git sources to local working copies so the entire CFDrs dep
# graph uses a single version of each Atlas foundation crate.

# ATLAS-PATH-DEP-AUDIT-2 round-4 closure
