[workspace]
members = [
    "crates/cfd-core",
    "crates/cfd-math",
    "crates/cfd-io",
    "crates/cfd-schematics",
    "crates/cfd-schematic-mesh",
    "crates/cfd-1d",
    "crates/cfd-2d",
    "crates/cfd-3d",
    "crates/cfd-optim",
    "crates/cfd-validation",
    "crates/cfd-python",
    "xtask",
]
exclude = []
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Ryan Clanton <ryan@clanton.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/CFDrs"
homepage = "https://ryancinsight.github.io/CFDrs/"
# Per-crate `documentation` points at that crate's own docs.rs page; this
# workspace default is the project book, which is the only documentation URL
# that is correct for every member. There is no `cfd-suite` package.
documentation = "https://ryancinsight.github.io/CFDrs/"
readme = "README.md"
keywords = ["cfd", "simulation", "fluid-dynamics", "computational", "physics"]
categories = ["science", "simulation"]

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
hashbrown = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Math and numerical
aequitas = { version = "0.2.0", git = "https://github.com/ryancinsight/aequitas", default-features = false, features = ["std"] }
proteus = { version = "0.1.0", git = "https://github.com/ryancinsight/proteus" }
hyperion = { version = "0.1.0", git = "https://github.com/ryancinsight/hyperion", default-features = false, features = ["std"] }
tyche-core = { version = "0.2.0", git = "https://github.com/ryancinsight/tyche" }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false, features = ["std"] }
iris = { package = "iris-viz", version = "0.1.0", git = "https://github.com/ryancinsight/iris" }
bytemuck = "1.14"
rand = "0.8"

# Data structures
indexmap = "2.0"
petgraph = "0.6"
slotmap = "1.0"

# Mesh / geometry
geometry-predicates = "0.3"

# Documentation
aquamarine = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }

# File I/O
csv = "1.3"

# Testing
proptest = "1.4"
criterion = "0.5"

# Internal crates
cfd-core = { path = "crates/cfd-core", default-features = false }
cfd-math = { path = "crates/cfd-math" }
cfd-io = { path = "crates/cfd-io" }
# Editable working copies live at the atlas root under repos/{gaia,apollo,consus};
cfd-mesh = { version = "0.4.0", git = "https://github.com/ryancinsight/gaia", package = "gaia-mesh" }
apollo-fft = { version = "0.26.0", git = "https://github.com/ryancinsight/apollo" }
apollo-nufft = { version = "0.7.0", git = "https://github.com/ryancinsight/apollo" }
leto = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std"] }
leto-ops = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std"] }
# consus: pure-Rust scientific storage formats (HDF5 etc.). Consumed by cfd-io
# behind the `hdf5` feature for real HDF5 output.
consus-core = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", default-features = false }
consus-hdf5 = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git" }
consus-io = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git" }
# ritk: RITK imaging toolkit; owns the VTK data model and I/O. Consumed by
# cfd-io behind the `vtk` feature for VTK creation.
ritk-vtk = { version = "0.2.0", git = "https://github.com/ryancinsight/ritk" }
# hermes: SIMD abstraction workspace. Provides generic runtime-dispatched
# SIMD operations (dot, elementwise, reductions) over f32/f64/i32.
hermes-simd = { version = "0.6.0", git = "https://github.com/ryancinsight/hermes.git" }
# moirai: unified concurrency runtime replacing tokio + rayon. Moirai's parallel,
# Mnemosyne, and Melinoe surfaces are enabled for the CFDrs workspace.
moirai = { version = "0.5.0", git = "https://github.com/ryancinsight/Moirai", package = "moirai-runtime", default-features = false, features = ["parallel", "mnemosyne-memory", "melinoe"] }
# themis: typed NUMA/topology placement law (consumed by the compute layer for
# first-touch buffer locality; the melinoe feature enables branded placement).
themis = { version = "0.10.1", git = "https://github.com/ryancinsight/themis", package = "themis-topology" }
# melinoe: branded capability evidence (ZST tokens/permits) for compute seams.
melinoe = { version = "0.9.0", git = "https://github.com/ryancinsight/melinoe.git", default-features = false }
# hephaestus-wgpu: Atlas GPU provider used for device acquisition and the
# ongoing replacement of CFDrs-owned raw WGPU kernels.
hephaestus-wgpu = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus" }
# athena: backend-neutral Krylov solver suite (athena-core = contracts,
# athena-leto = Leto CPU backend). Used by cfd-math/linear_solver/krylov.rs.
athena-core = { version = "0.1.0", git = "https://github.com/ryancinsight/athena" }
athena-leto = { version = "0.1.0", git = "https://github.com/ryancinsight/athena" }
cfd-schematics = { path = "crates/cfd-schematics" }
cfd-schematic-mesh = { path = "crates/cfd-schematic-mesh" }
cfd-1d = { path = "crates/cfd-1d" }
cfd-2d = { path = "crates/cfd-2d" }
cfd-3d = { path = "crates/cfd-3d" }
cfd-optim = { path = "crates/cfd-optim" }
cfd-validation = { path = "crates/cfd-validation" }

[workspace.lints.rust]
# Floor: warn. Per-crate `#![deny(missing_docs)]` is the strict escalation
# surface (each crate decides its own missing-docs tier; the workspace floor
# stays at warn so existing crates without missing-docs discipline remain
# warning-only and promotion is incremental).
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed is a
# hard error. Counts are `cargo clippy --workspace --all-targets` hits at the
# time the floor was established, deduplicated per source site, as total
# (production), where production excludes `#[cfg(test)]` modules and test, bench
# and example targets. Burn a class down to zero, then delete its line -- the
# floor tightens, never loosens.

doc_markdown = "allow"                      # 2640 (2239 prod)
cast_precision_loss = "allow"               # 1115 (613 prod)
missing_errors_doc = "allow"                # 733 (733 prod)
must_use_candidate = "allow"                # 513 (513 prod)
similar_names = "allow"                     # 503 (407 prod)
uninlined_format_args = "allow"             # 494 (0 prod)
unreadable_literal = "allow"                # 183 (63 prod)
cast_possible_truncation = "allow"          # 159 (132 prod)
too_many_lines = "allow"                    # 151 (106 prod)
unused_self = "allow"                       # 131 (131 prod)
unnecessary_wraps = "allow"                 # 117 (86 prod)
cast_possible_wrap = "allow"                # 115 (94 prod)
missing_panics_doc = "allow"                # 111 (111 prod)
cast_sign_loss = "allow"                    # 105 (82 prod)
too_many_arguments = "allow"                # 105 (105 prod)
return_self_not_must_use = "allow"          # 98 (98 prod)
items_after_statements = "allow"            # 90 (50 prod)
map_unwrap_or = "allow"                     # 87 (0 prod)
many_single_char_names = "allow"            # 73 (60 prod)
needless_range_loop = "allow"               # 64 (48 prod)
used_underscore_binding = "allow"           # 63 (60 prod)
unnecessary_debug_formatting = "allow"      # 50 (0 prod)
redundant_closure_for_method_calls = "allow"# 48 (37 prod)
needless_pass_by_value = "allow"            # 47 (47 prod)
cast_lossless = "allow"                     # 44 (0 prod)
format_push_string = "allow"                # 35 (25 prod)
semicolon_if_nothing_returned = "allow"     # 27 (0 prod)
explicit_iter_loop = "allow"                # 23 (0 prod)
match_same_arms = "allow"                   # 19 (17 prod)
float_cmp = "allow"                         # 17 (9 prod)
no_effect_underscore_binding = "allow"      # 17 (0 prod)
unnecessary_lazy_evaluations = "allow"      # 14 (14 prod)
manual_let_else = "allow"                   # 11 (7 prod)
field_reassign_with_default = "allow"       # 11 (2 prod)
match_wildcard_for_single_variants = "allow"# 8 (0 prod)
manual_midpoint = "allow"                   # 6 (0 prod)
ignored_unit_patterns = "allow"             # 5 (0 prod)

# Immediate burn-down targets: each is a handful of judgement-call sites left
# after the mechanical classes were fixed outright rather than ratcheted.
if_same_then_else = "allow"                 # 3 (3 prod)
comparison_chain = "allow"                  # 3 (0 prod)
should_implement_trait = "allow"            # 2 (2 prod)
trivially_copy_pass_by_ref = "allow"        # 2 (2 prod)
inline_always = "allow"                     # 1 (1 prod)
struct_excessive_bools = "allow"            # 1 (1 prod)
module_inception = "allow"                  # 1 (0 prod)

# --- Restriction floor ---
# `unwrap_used` is denied outright: no workspace-wide allow. The 1116 existing
# sites (211 in production) are pinned per file by
# `#![expect(clippy::unwrap_used, reason = "ratchet CFDRS-UNWRAP-1")]`
# (`#![cfg_attr(test, expect(...))]` where a `src/` file's unwraps all sit inside
# `#[cfg(test)]`), which self-expires the moment a file's last unwrap goes.
unwrap_used = "deny"

# Output-erasure floor, carried forward from the pre-promotion table. Library
# crates route output through `tracing` or the application's output layer.
print_stderr = "deny"
print_stdout = "deny"
dbg_macro = "deny"
