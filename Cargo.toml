[workspace]
members = [
    "crates/cfd-core",
    "crates/cfd-math",
    "crates/cfd-io",
    "crates/cfd-schematics",
    "crates/cfd-1d",
    "crates/cfd-2d",
    "crates/cfd-3d",
    "crates/cfd-optim",
    "crates/cfd-validation",
    "crates/cfd-python",
    "xtask",
]
exclude = []
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Ryan Clanton <ryan@clanton.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/cfd-suite"
homepage = "https://github.com/ryancinsight/cfd-suite"
documentation = "https://docs.rs/cfd-suite"
readme = "README.md"
keywords = ["cfd", "simulation", "fluid-dynamics", "computational", "physics"]
categories = ["science", "simulation"]

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Math and numerical
aequitas = { path = "../aequitas", version = "0.1.0", default-features = false, features = ["std"] }
proteus = { path = "../proteus", version = "0.1.0" }
hyperion = { path = "../hyperion", version = "0.1.0", default-features = false, features = ["std"] }
tyche-core = { path = "../tyche/crates/tyche-core", version = "0.1.0" }
eunomia = { version = "0.7.0", git = "https://github.com/ryancinsight/eunomia", default-features = false, features = ["std"] }
iris = { path = "../iris", version = "0.1.0" }
approx = "0.5"
bytemuck = "1.14"
rand = "0.8"

# Data structures
indexmap = "2.0"
petgraph = "0.6"
slotmap = "1.0"

# Mesh / geometry
geometry-predicates = "0.3"

# Documentation
aquamarine = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }

# File I/O
csv = "1.3"

# Testing
proptest = "1.4"
criterion = "0.5"

# Internal crates
cfd-core = { path = "crates/cfd-core", default-features = false }
cfd-math = { path = "crates/cfd-math" }
cfd-io = { path = "crates/cfd-io" }
# Shared crates consumed from their canonical remotes (default branch = latest).
# Editable working copies live at the atlas root under repos/{gaia,apollo,consus};
# publish changes there (commit + push), then `cargo update -p <crate>`.
cfd-mesh = { path = "../gaia", package = "gaia", features = ["cfdrs-integration"] }
apollo-fft = { path = "../apollo/crates/apollo-fft" }
apollo-nufft = { path = "../apollo/crates/apollo-nufft" }
leto = { path = "../leto/crates/leto", default-features = false, features = ["std"] }
leto-ops = { path = "../leto/crates/leto-ops", default-features = false, features = ["std"] }
# consus: pure-Rust scientific storage formats (HDF5 etc.). Consumed by cfd-io
# behind the `hdf5` feature for real HDF5 output.
consus-core = { path = "../consus/crates/consus-core", default-features = false }
consus-hdf5 = { path = "../consus/crates/consus-hdf5" }
# ritk: RITK imaging toolkit; owns the VTK data model and I/O. Consumed by
# cfd-io behind the `vtk` feature for VTK creation.
ritk-vtk = { path = "../ritk/crates/ritk-vtk" }
# hermes: SIMD abstraction workspace. Provides generic runtime-dispatched
# SIMD operations (dot, elementwise, reductions) over f32/f64/i32.
hermes-simd = { path = "../hermes/crates/hermes-simd" }
# moirai: unified concurrency runtime replacing tokio + rayon. Moirai's parallel,
# Mnemosyne, and Melinoe surfaces are enabled for the CFDrs workspace.
moirai = { path = "../moirai/moirai", default-features = false, features = ["parallel", "mnemosyne", "melinoe"] }
# hephaestus-wgpu: Atlas GPU provider used for device acquisition and the
# ongoing replacement of CFDrs-owned raw WGPU kernels.
hephaestus-wgpu = { path = "../hephaestus/crates/hephaestus-wgpu" }
# athena: backend-neutral Krylov solver suite (athena-core = contracts,
# athena-leto = Leto CPU backend). Used by cfd-math/linear_solver/krylov.rs.
athena-core = { path = "../athena/crates/athena-core" }
athena-leto = { path = "../athena/crates/athena-leto" }
cfd-schematics = { path = "crates/cfd-schematics" }
cfd-1d = { path = "crates/cfd-1d" }
cfd-2d = { path = "crates/cfd-2d" }
cfd-3d = { path = "crates/cfd-3d" }
cfd-optim = { path = "crates/cfd-optim" }
cfd-validation = { path = "crates/cfd-validation" }

# Redirect all git sources to local working copies so the entire CFDrs dep
# graph uses a single version of each Atlas foundation crate.

# ATLAS-PATH-DEP-AUDIT-2 round-4 closure
