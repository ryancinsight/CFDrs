name: Python Release

# A release builds, validates and publishes the wheels. A pull request that
# changes the binding crate, its dependency closure or this workflow builds and
# validates the same wheel set without release identity, so a closure that
# cannot build on a wheel platform fails before the release is cut.
on:
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "crates/cfd-python/**"
      - ".github/workflows/python-release.yml"

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-wheels:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: Build and validate wheels
    # Verification mode attaches nothing to a release, but the shared
    # workflow's validation job declares contents: write unconditionally and
    # a called job may not exceed the caller's grant.
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ryancinsight/atlas/.github/workflows/python-wheels.yml@227ff172612b8aff553be22be89fabdf71838a03
    with:
      distribution: cfdrs-python
      import-name: cfd_python
      manifest-path: crates/cfd-python/Cargo.toml
      atlas-ref: 227ff172612b8aff553be22be89fabdf71838a03
      abi3: true
      abi3-python: "3.9"
      python-test-path: crates/cfd-python/tests
      verification: true

  wheels:
    if: >-
      github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'cfdrs-python-v')
    name: Build and attach release distributions
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ryancinsight/atlas/.github/workflows/python-wheels.yml@227ff172612b8aff553be22be89fabdf71838a03
    with:
      distribution: cfdrs-python
      import-name: cfd_python
      manifest-path: crates/cfd-python/Cargo.toml
      atlas-ref: 227ff172612b8aff553be22be89fabdf71838a03
      tag-prefix: cfdrs-python-v
      abi3: true
      abi3-python: "3.9"
      python-test-path: crates/cfd-python/tests

  publish:
    if: >-
      github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'cfdrs-python-v')
    name: Publish release distributions to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/cfdrs-python
    permissions:
      id-token: write
    steps:
      - name: Download validated release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheels
          path: dist

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          print-hash: true
