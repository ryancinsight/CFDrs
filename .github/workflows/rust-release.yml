name: Crates.io Release

# Version-change publishing (ATLAS-PUB-010, atlas ADR 0068): a push to main or
# the daily schedule publishes every crate whose manifest version the registry
# lacks and tags it. A published release and a workflow_dispatch dry run keep
# the single-crate path. Trusted publishers on crates.io name this filename.

on:
  push:
    branches: [main]
  schedule:
    - cron: "26 6 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package || github.event_name }}
  cancel-in-progress: false

jobs:
  # The blocking public-surface verdict belongs to the release, not to a
  # merge: the ci workflow calls the shared gate informationally on PRs, and
  # a default-branch push must not compare against the published baseline
  # (atlas ATLAS-SEMVER-GATE-MAIN-PUSH-RED). `release-gate` declares the
  # release intent this workflow's own event cannot carry.
  semver:
    name: SemVer gate (release)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@50802ef4c975bdb1e668b94a700d8310f0348e9c
    with:
      release-gate: true
      package: cfd-1d,cfd-2d,cfd-3d,cfd-core,cfd-io,cfd-math,cfd-optim,cfd-python,cfd-schematic-mesh,cfd-schematics,cfd-validation
      apt-packages: libfontconfig1-dev
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  publish:
    needs: semver
    # Gate stays here: the shared validate job has no prefix check and fails
    # closed, so a legacy tag would go from a silent skip to a red run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action.
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@4c31dd753f06dd93b4c04798cf781df253e3e532
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: 1.97.0
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}

  publish-pending:
    name: Publish pending crate versions
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ryancinsight/atlas/.github/workflows/crates-publish-pending.yml@50802ef4c975bdb1e668b94a700d8310f0348e9c
    permissions:
      contents: write # creates the release tags
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: 1.97.0
      apt-packages: libfontconfig1-dev
