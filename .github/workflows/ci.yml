name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # CFDrs declared a pedantic lint floor in Cargo.toml but never ran clippy in
  # CI, so the floor was unenforced and drifted freely. This job is what makes
  # the manifest's `deny` mean anything on a pull request.
  lint:
    name: Format and lint (pedantic floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Atlas path dependencies
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@1a7cdca7309f4a765b5bf644704521fa7c849208
        with:
          manifest: Cargo.toml
          destination: ..
          atlas_ref: 1a7cdca7309f4a765b5bf644704521fa7c849208

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  check-figures:
    name: Check book figures SSOT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Atlas path dependencies
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@1a7cdca7309f4a765b5bf644704521fa7c849208
        with:
          manifest: Cargo.toml
          destination: ..
          atlas_ref: 1a7cdca7309f4a765b5bf644704521fa7c849208

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-xtask-${{ hashFiles('**/Cargo.lock') }}

      - name: Check book figures
        run: cargo run -p xtask -- check-figures
