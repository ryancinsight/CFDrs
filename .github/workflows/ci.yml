name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

permissions:
  contents: read

# Superseded runs cancel rather than queue. Without this, every force-push
# or rapid commit series on one branch accumulated a full three-job pipeline
# per push; during the 2026-08-25 runner-saturation window CFDrs carried the
# fleet's worst queue-to-work ratio (828 queued minutes against 741 consumed).
concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@d6686df7628c26d464f1982d55164f1b627d3f2a
    with:
      package: cfd-1d,cfd-2d,cfd-3d,cfd-core,cfd-io,cfd-math,cfd-optim,cfd-python,cfd-schematic-mesh,cfd-schematics,cfd-validation
      apt-packages: libfontconfig1-dev
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  # First and alone: needs no toolchain, cache or build, and guards the one
  # artifact whose correctness cannot be checked from inside the environment
  # that produces it. The Atlas overlay's `[patch]` redirects make cargo
  # resolve first-party deps to local paths and write a Cargo.lock with every
  # `source = "git+..."` line stripped; that lock resolves fine locally and
  # fails every `--locked` job here. The committed lock carries a first-party
  # git-source count of zero right now, so this gate will stay red until the
  # lock is regenerated — which is the point.
  lockfile:
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d

  # Build-once/shard was measured and reverted here (PR 490, runs
  # 36468532424/36472002537/36478822432): `cargo nextest archive`
  # (compile-only, no test execution) took 11m24s-11m33s standalone,
  # matching the pre-split single job's combined compile+run "Tests" step
  # (11m32s, run 36368805748) almost exactly. The gate is compile-bound, not
  # test-execution-bound - 241 third-party crates recompiled from scratch in
  # the archive window despite a reported ~4GB rust-cache hit (test-profile
  # objects evidently aren't surviving the cache the way clippy's do).
  # Sharding parallelizes test execution, which was already a negligible
  # fraction of the 11+ minutes, while adding a serial compile stage plus an
  # archive-upload/download round trip ahead of it - net negative on both
  # critical-path time and total runner-minutes on an already-saturated
  # pool. Filed as ATLAS-CFDRS-TEST-PROFILE-CACHE-MISS in gap_audit.md
  # (rust-cache not preserving `--cfg test`-profile objects for this
  # workspace) - fixing the actual compile cost needs that investigated
  # first, not a different job topology.
  rust-workspace:
    name: Rust workspace gate
    needs: lockfile
    if: ${{ needs.lockfile.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep the measured finite-volume/FEM cases out of the parallel suite.
      # They are run in a second invocation below so unrelated tests cannot
      # consume the hosted runner while their existing per-test budget holds.
      NUMERICAL_FIDELITY_FILTER: >-
        test(/primitive_selective_split_tree_1d_2d_cross_fidelity/) |
        test(/test_venturi_blood_flow/) |
        test(/ga_validation_geometry_produces_converged_informative_2d_result/) |
        test(/microventuri_fallback_case_produces_converged_informative_2d_result/) |
        test(/microventuri_35um_case_produces_converged_informative_2d_result/) |
        test(/cross_fidelity_trifurcation_dominance/) |
        test(/test_benchmark_run_integration/) |
        test(/test_step_11_lid_driven_cavity/) |
        test(/cross_fidelity_stenosis_shear_thinning/) |
        test(/cross_fidelity_venturi_(two_dimensional|three_dimensional)_loss_coefficient/)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Normalize materialized dependency lock
        # The Atlas checkout action replaces git providers with path sources.
        # Regenerate the ephemeral lock before every later --locked gate.
        run: cargo metadata --format-version 1 --all-features > /dev/null

      - name: Install nextest
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649
        with:
          tool: cargo-nextest@0.9.140

      - name: Install native fontconfig headers
        run: |
          # Each apt call is bounded and retried: an unbounded apt-get can stall
          # on the dpkg lock held by unattended-upgrades early in a runner's
          # life, and without a deadline that silently consumes the whole
          # 60-minute job budget instead of failing fast.
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update               && sudo timeout 240 apt-get install --yes libfontconfig1-dev; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying" >&2
            sleep 20
          done
          echo "apt-get did not complete after 3 attempts" >&2
          exit 1

      # Root cause of ATLAS-CFDRS-TEST-PROFILE-CACHE-MISS: this job and
      # check-figures shared one key ("cfdrs"). check-figures finishes ~14min
      # earlier (its `cargo run -p xtask` only builds xtask + its own deps,
      # not the workspace's full clippy/test dependency graph), so on a main
      # push its post-step claims the shared key first; GitHub's cache API is
      # immutable per key, so this job's later save of the FULL dependency
      # set silently no-ops. Every subsequent run restores a "full match" -
      # confirmed via the Swatinem/rust-cache log line
      # `Restored from cache key "..." full match: true` on runs
      # 36403691327 and 36472002537 - against check-figures' shallow content,
      # and rust-cache skips re-saving on a full-key match (there is nothing
      # to reconcile: the key hasn't changed, so it trusts the restore),
      # so the gap can never self-heal. Splitting the key so only this job
      # writes "cfdrs-gate" fixes the collision; the value is also bumped
      # (was "cfdrs") so the next save starts from a clean slate instead of
      # extending the already-poisoned entry.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: cfdrs-gate
          # TEMPORARY for this PR's verification only (coordinator-requested):
          # saves on this branch too so two consecutive runs can prime and
          # then measure the fresh "cfdrs-gate" key without waiting for a
          # merge to main. Reverts to main-only before merge.
          save-if: true

      - name: Format
        run: cargo fmt --all --check

      # Clippy performs its own compilation and supplies the same type-check
      # coverage as `cargo check`; keeping both workspace-wide builds here
      # wastes runner time and duplicates peak memory pressure.
      # `cargo check` remains available locally for focused crate debugging.
      # The clippy component is installed above, so without this step the
      # workspace's denied pedantic floor is declared and never enforced -
      # which is the state CFDrs was already in when the floor was found to be
      # inert (ten crates carried in-source `#![warn(clippy::pedantic)]`
      # overriding the manifest allow-list).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        # CARGO_LOG diagnostic is temporary verification instrumentation for
        # ATLAS-CFDRS-TEST-PROFILE-CACHE-MISS (coordinator-requested fingerprint
        # evidence); remove once the cfdrs-gate key's first save/restore cycle
        # is confirmed.
        run: |
          CARGO_LOG=cargo::core::compiler::fingerprint=info \
            cargo build --tests -p cfd-core --locked 2>&1 | grep -i "libc" | head -40 || true
          cargo nextest run --workspace --no-fail-fast --locked -E "not ($NUMERICAL_FIDELITY_FILTER)"

      - name: Numerical fidelity tests
        run: cargo nextest run --workspace --no-fail-fast --locked -E "$NUMERICAL_FIDELITY_FILTER" --test-threads 1

      - name: Doctests
        run: cargo test --doc --workspace --locked

  check-figures:
    name: Check book figures SSOT
    needs: lockfile
    if: ${{ needs.lockfile.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Normalize materialized dependency lock
        run: cargo metadata --format-version 1 --all-features > /dev/null

      # Own key, separate from rust-workspace's "cfdrs-gate": this job only
      # builds xtask + its own dependency subset (`cargo run -p xtask`), a
      # much shallower graph than the full clippy/test dependency set. It
      # finishes ~14min before rust-workspace on a main push, so sharing one
      # key meant its post-step claimed the save first every time - GitHub's
      # cache API is immutable per key, so rust-workspace's later save of the
      # full dependency set silently no-op'd forever after
      # (ATLAS-CFDRS-TEST-PROFILE-CACHE-MISS). Each job now owns its key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: cfdrs-figures
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check book figures
        run: cargo run --locked -p xtask -- check-figures
