name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-figures:
    name: Check book figures SSOT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Atlas path dependencies
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@51d8600cf3077e6ad6aafa5603b3289444b1719f
        with:
          manifest: Cargo.toml
          destination: ..
          atlas_ref: 51d8600cf3077e6ad6aafa5603b3289444b1719f

      - name: Checkout Coeus path dependencies
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@51d8600cf3077e6ad6aafa5603b3289444b1719f
        with:
          manifest: ../coeus/Cargo.toml
          destination: ..
          atlas_ref: 51d8600cf3077e6ad6aafa5603b3289444b1719f

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-xtask-${{ hashFiles('**/Cargo.lock') }}

      - name: Check book figures
        run: cargo run -p xtask -- check-figures
