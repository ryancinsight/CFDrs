[profile.default]
# Per-test timeout budget (nextest 0.9): terminate after 2 × 15s = 30s.
slow-timeout = { period = "15s", terminate-after = 2 }

# Surface output immediately on failure to aid debugging hung tests.
failure-output = "immediate"

# Emit status updates for passing/slow tests to see progress in long suites.
status-level = "all"

# WGPU device creation is a process-global driver resource on this host. The
# GPU contracts and compute capability detection create their own provider, so
# Nextest serializes only those hardware-owning tests while unrelated CPU
# contracts retain normal parallelism.
[test-groups]
gpu-device = { max-threads = 1 }
numerical-fidelity = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(cfd-core) & (test(/compute::gpu/) | test(/compute::tests/) | test(/gpu_tests/))'
test-group = 'gpu-device'

[[profile.default.overrides]]
filter = 'package(cfd-math) & test(/gpu_metrics_tests/)'
test-group = 'gpu-device'

[[profile.default.overrides]]
filter = 'package(cfd-2d) & test(/accelerated/)'
test-group = 'gpu-device'

# These cases each fit the 30-second per-test budget in isolation, but their
# finite-volume/FEM workloads contend for the hosted runner's CPU when they
# start together.  Serializing only this measured set preserves parallelism
# for the rest of the workspace without changing the workload or timeout.
[[profile.default.overrides]]
filter = 'test(/primitive_selective_split_tree_1d_2d_cross_fidelity/) | test(/ga_validation_geometry_produces_converged_informative_2d_result/) | test(/microventuri_35um_case_produces_converged_informative_2d_result/) | test(/test_benchmark_run_integration/) | test(/cross_fidelity_stenosis_shear_thinning/) | test(/cross_fidelity_venturi_total_loss_coefficient/)'
test-group = 'numerical-fidelity'
